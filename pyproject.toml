[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "terraform", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S104",  # binding 0.0.0.0 is correct inside a container
  "S311",  # random is used for fault injection, not for crypto
  "E501",  # long lines are handled by the formatter
  "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "E402"]   # asserts are the point; env must precede import

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
