{{- if .Values.monitoring.serviceMonitor.enabled -}}
{{- /*
  prometheus-operator ServiceMonitor, for the LOCAL kind stack (kube-prometheus).
  Requires the ServiceMonitor CRD to already exist in the cluster.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "orders-api.fullname" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "orders-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
