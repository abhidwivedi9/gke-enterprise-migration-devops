apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orders-api.fullname" . }}-config
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
data:
  # NON-SECRET configuration only. Anything sensitive goes in a Secret, or
  # better, Secret Manager - see SECURITY.md.
  #
  # The Deployment hashes this file into a pod annotation, so changing a value
  # here triggers a rolling update. Without that hash, editing a ConfigMap
  # changes nothing about the running pods.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

  # Build identity, also exposed as config so it appears in `kubectl describe`.
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  APP_NAME: {{ include "orders-api.name" . | quote }}
