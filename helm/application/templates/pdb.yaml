{{- if .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orders-api.fullname" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  # VOLUNTARY disruptions only: node drains, cluster upgrades, autoscaler
  # scale-down. A PDB does NOT protect against a node hard-failing, an OOM kill,
  # or a crash - those are involuntary and no budget applies.
  #
  # DANGER: minAvailable >= replicaCount makes the workload undrainable. Every
  # eviction is refused forever, `kubectl drain` hangs, and cluster upgrades
  # stall indefinitely. That is failure-lab scenario 11.
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "orders-api.selectorLabels" . | nindent 6 }}
{{- end }}
