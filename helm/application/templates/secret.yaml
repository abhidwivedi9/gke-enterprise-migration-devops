{{- if .Values.secrets.create -}}
{{- /*
  DEVELOPMENT AND LOCAL TESTING ONLY.

  A chart-managed Secret means the value has to come from somewhere - a values
  file, a --set flag, or CI. All three leave it recoverable:
    - values files get committed
    - --set lands in your shell history
    - the value is stored in the Helm release Secret and survives in
      `helm get values` for every historical revision

  For anything real, use one of:
    - secrets.existingSecret, created out of band (better)
    - Secret Manager + the CSI driver, or External Secrets Operator (best -
      the value never becomes a Kubernetes Secret at all and rotates centrally)

  See SECURITY.md.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orders-api.fullname" . }}-secrets
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  annotations:
    # Loud on purpose. Anyone running `kubectl describe secret` should see this.
    warning: "chart-managed Secret - development only, do not use in production"
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
