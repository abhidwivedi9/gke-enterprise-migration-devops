{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orders-api.serviceAccountName" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.gcpServiceAccount }}
    # THE GKE HALF of the Workload Identity binding.
    #
    # The other half is the IAM policy in terraform/modules/iam that grants
    # roles/iam.workloadIdentityUser to
    #   serviceAccount:PROJECT.svc.id.goog[NAMESPACE/KSA_NAME]
    #
    # BOTH halves are required, and the namespace and KSA name must match on
    # both sides EXACTLY. If they do not, calls to Google APIs fail with a 403
    # from the metadata server whose message names neither side of the mismatch.
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Do not hand every pod a Kubernetes API token it never uses.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
