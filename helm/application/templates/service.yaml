apiVersion: v1
kind: Service
metadata:
  name: {{ include "orders-api.fullname" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # Named target port, not a number. If the container port ever moves, the
      # Deployment's port name still resolves and the Service keeps working.
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orders-api.selectorLabels" . | nindent 4 }}
